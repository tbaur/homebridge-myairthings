name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.13.0, 22.x, 24.x, 26.x]
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build TypeScript
      run: npm run build
    - name: Verify committed dist is in sync with src
      run: |
        if [ -n "$(git status --porcelain -- dist)" ]; then
          echo "dist/ is dirty or has untracked files after build:"
          git status --porcelain -- dist
          exit 1
        fi
        git diff --exit-code -- dist
    - name: Run linter
      run: npm run lint
    - name: Type-check tests against production settings
      run: npx tsc --noEmit -p tsconfig.test.json
    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test
    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: matrix.node-version == '22.x'
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '24.x'
        cache: 'npm'
    - run: npm ci
    - name: Audit runtime dependencies
      run: npm audit --omit=dev --audit-level=moderate
    - name: Audit development dependencies
      run: npm audit --audit-level=high || echo "::warning::Development dependency advisories found; review npm audit output"

  secrets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Reject tokens
      run: |
        set -euo pipefail
        if grep -rInE 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{8,}\.|Authorization:[[:space:]]*Basic[[:space:]]+[A-Za-z0-9+/=]{16,}' \
             --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=.git \
             README.md CONTRIBUTING.md SECURITY.md DEVELOPMENT.md RELEASING.md \
             CHANGELOG.md docs src tests scripts dist config.schema.json .github ; then
          echo "::error::A JWT or a Basic credential is committed."
          exit 1
        fi
        echo "No credential-shaped strings found."
